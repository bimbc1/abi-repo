                  Host: !If
                    - IsGovCloud
                    - console.amazonaws-us-gov.com
                    - console.aws.amazon.com
              - !Sub
                - '[button:primary:${Label}
                  (${Fn})](https://${Host}/cloudwatch/home?region=${AWS::Region}#metricsV2:graph=~%28view~''timeSeries~stacked~false~region~''${AWS::Region}~stat~''Sum~period~300~title~''${Fn}~metrics~%28~%28~''AWS*2fLambda~''Invocations~''FunctionName~''${Fn}%29~%28~''.~''Errors~''.~''.%29~%28~''.~''Throttles~''.~''.%29~%28~''.~''ConcurrentExecutions~''.~''.~%28stat~''Maximum%29%29~%28~''.~''Duration~''.~''.~%28stat~''Average~yAxis~''right%29%29%29%29)'
                - Label: Database Processor Lambda
