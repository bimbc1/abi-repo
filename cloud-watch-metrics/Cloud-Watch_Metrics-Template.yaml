AWSTemplateFormatVersion: '2010-09-09'
Description: HIE Analytics Operational Monitoring CloudWatch Dashboard and Alarms

Parameters:
  Env:
    Type: String
    AllowedValues:
      - dev
      - stg
      - prod

Conditions:
  IsGovCloud: !Equals [!Ref 'AWS::Partition', aws-us-gov]

Resources:

  # ---------------------------------------------------------------------
  # ALARMS -- these watch metrics that already exist in CloudWatch. They
  # do not care whether the metric was published by a direct API call or
  # a log-filter; they just read the namespace + metric name.
  # ---------------------------------------------------------------------

  DatabaseConnectionFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-DatabaseConnectionFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails to connect to the database.
      Namespace: HIE/OperationalMonitoring
      MetricName: DatabaseConnectionFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  MetadataLambdaFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-LambdaFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails while processing a record.
      Namespace: HIE/OperationalMonitoring
      MetricName: MetadataLambdaFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ServiceAvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-ServiceAvailability
      AlarmDescription: Fires when the Lambda reports itself unavailable (retry
        handler also failed), or when it has not reported availability at all.
      Namespace: HIE/OperationalMonitoring
      MetricName: ServiceAvailability
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  CountMismatchEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-CountMismatchEvents
      AlarmDescription: Fires when a batch's actual file/row count does not match its manifest.
      Namespace: HIE/OperationalMonitoring
      MetricName: CountMismatchEvents
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RetryHandlerInvocationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-RetryHandlerFailures
      AlarmDescription: Fires when the retry_utils handler itself fails to run -- no
        retry is guaranteed for the underlying error.
      Namespace: HIE/OperationalMonitoring
      MetricName: RetryHandlerInvocationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------
  # DASHBOARD -- displays the metrics above plus the rest of what the
  # Lambda publishes, grouped the same way the code groups them
  # (HIE/OperationalMonitoring vs HIE/PartnerMonitoring).
  # ---------------------------------------------------------------------

  ManifestMetadataDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub project-hie-analytics-operational-dashboard-${Env}
      # Function name is derived from the Lambda ARN exported by the Lambda
      # stack (arn:<partition>:lambda:<region>:<account>:function:<NAME>),
      # so it is never hardcoded here.
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "# Project HIE Analytics Operational Monitoring - ${Env}"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 1,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Operational Monitoring Status"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 2,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## AWS Transfer Family"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 3,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Transfer family",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"FilesIn\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "FilesIn"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 3,
                "width": 16,
                "height": 6,
                "properties": {
                  "title": "FilesIn",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 1800,
                  "stat": "Sum",
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "showUnits": false
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "S3ObjectArrivals",
                      {
                        "id": "e1",
                        "stat": "Sum",
                        "period": 1800,
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "FILL(e1, 0)",
                        "id": "files",
                        "label": "Received Files: ${!SUM}",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      {
                        "expression": "files*0+6",
                        "id": "expected",
                        "label": "Expected Files: ${!SUM}",
                        "color": "#7f7f7f"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "label": "Below expected",
                        "value": 6,
                        "fill": "below",
                        "color": "#d13212"
                      },
                      {
                        "label": "Expected met",
                        "value": 6,
                        "fill": "above",
                        "color": "#2ca02c"
                      }
                    ]
                  }
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 9,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Authentication"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 10,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Authentication",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "period": 300,
                  "stat": "Sum",
                  "start": "-PT24H",
                  "end": "P0D",
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "DatabaseConnectionFailures",
                      {
                        "label": "Database connection failures (last 24h)"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK (3 or fewer)",
                        "value": 3,
                        "fill": "below"
                      },
                      {
                        "color": "#d13212",
                        "label": "More than 3 in 24h",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 16,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Workflow Health"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 17,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Retries by failure type - Manifest Metadata Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      "FailureType",
                      "DatabaseConnectionFailure",
                      {
                        "label": "Database connection",
                        "color": "#d13212"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      "FailureType",
                      "SQSPublishFailure",
                      {
                        "label": "SQS publish",
                        "color": "#ff7f0e"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      "FailureType",
                      "OtherFailure",
                      {
                        "label": "Other failures",
                        "color": "#9467bd"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "RetryHandlerInvocationFailures",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      {
                        "label": "Retry handler failed",
                        "color": "#8c564b"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 17,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Retries by failure type - Tables Generator Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${TablesGeneratorFunctionName}",
                      "FailureType",
                      "DatabaseConnectionFailure",
                      {
                        "label": "Database connection",
                        "color": "#d13212"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${TablesGeneratorFunctionName}",
                      "FailureType",
                      "SQSPublishFailure",
                      {
                        "label": "SQS publish",
                        "color": "#ff7f0e"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${TablesGeneratorFunctionName}",
                      "FailureType",
                      "OtherFailure",
                      {
                        "label": "Other failures",
                        "color": "#9467bd"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "RetryHandlerInvocationFailures",
                      "FunctionName",
                      "${TablesGeneratorFunctionName}",
                      {
                        "label": "Retry handler failed",
                        "color": "#8c564b"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 17,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Database Processor DLQ Messages",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Maximum",
                  "metrics": [
                    [
                      "AWS/SQS",
                      "ApproximateNumberOfMessagesVisible",
                      "QueueName",
                      "project-hie-analytics-database-processor-dlq-${Env}"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 23,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Lambda Health"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 24,
                "width": 24,
                "height": 3,
                "properties": {
                  "markdown": "Open the CloudWatch monitoring page for each Lambda function:\n\n${LambdaHealthButtons}"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 27,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Storage & Processing"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 28,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Storage & Processing",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "S3ObjectArrivals",
                      {
                        "label": "S3ObjectArrivals"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 28,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Processing Delays",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds",
                      {
                        "label": "Average delay",
                        "stat": "Average"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds",
                      {
                        "label": "Maximum delay",
                        "stat": "Maximum"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 28,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "ProcessingDelaySeconds",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 34,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Database Health"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 35,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "CRUD failures by type - Manifest Metadata Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      "FailureType",
                      "IntegrityViolation",
                      {
                        "label": "Integrity violation",
                        "color": "#ff7f0e"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      "FailureType",
                      "QueryFailure",
                      {
                        "label": "Query failure",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      "FailureType",
                      "OtherFailure",
                      {
                        "label": "Other failures",
                        "color": "#9467bd"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 35,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "CRUD failures by type -  Tables Generator Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${TablesGeneratorFunctionName}",
                      "FailureType",
                      "IntegrityViolation",
                      {
                        "label": "Integrity violation",
                        "color": "#ff7f0e"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${TablesGeneratorFunctionName}",
                      "FailureType",
                      "QueryFailure",
                      {
                        "label": "Query failure",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${TablesGeneratorFunctionName}",
                      "FailureType",
                      "OtherFailure",
                      {
                        "label": "Other failures",
                        "color": "#9467bd"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 35,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "CRUD failures by type - Database Processor Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${DatabaseProcessorFunctionName}",
                      "FailureType",
                      "IntegrityViolation",
                      {
                        "label": "Integrity violation",
                        "color": "#ff7f0e"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${DatabaseProcessorFunctionName}",
                      "FailureType",
                      "QueryFailure",
                      {
                        "label": "Query failure",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${DatabaseProcessorFunctionName}",
                      "FailureType",
                      "OtherFailure",
                      {
                        "label": "Other failures",
                        "color": "#9467bd"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 35,
                "width": 12,
                "height": 6,
                "properties": {
                  "title": "CRUD failures by type - Process Monitoring Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${ProcessMonitoringFunctionName}",
                      "FailureType",
                      "IntegrityViolation",
                      {
                        "label": "Integrity violation",
                        "color": "#ff7f0e"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${ProcessMonitoringFunctionName}",
                      "FailureType",
                      "QueryFailure",
                      {
                        "label": "Query failure",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${ProcessMonitoringFunctionName}",
                      "FailureType",
                      "OtherFailure",
                      {
                        "label": "Other failures",
                        "color": "#9467bd"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 41,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Partner Connectivity"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 42,
                "width": 24,
                "height": 6,
                "properties": {
                  "title": "Partner Connectivity - Current Connection Status",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerId} MetricName=\"StaleConnection\"', 'Sum')",
                        "id": "s1",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SUM(s1)",
                        "id": "m1",
                        "label": "Stale connections",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "IF(m1>0,m1)",
                        "id": "e1",
                        "label": "STALE CONNECTION DETECTED",
                        "color": "#d62728"
                      }
                    ],
                    [
                      {
                        "expression": "IF(m1==0,0)",
                        "id": "e2",
                        "label": "CONNECTION HEALTHY",
                        "color": "#2ca02c"
                      }
                    ]
                  ],
                  "view": "singleValue",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 48,
                "width": 24,
                "height": 6,
                "properties": {
                  "title": "Partner Connectivity - Breach Status",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"BreachEvents\"', 'Sum')",
                        "id": "s2",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SUM(s2)",
                        "id": "m2",
                        "label": "Breach events",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "IF(m2>0,m2)",
                        "id": "e3",
                        "label": "IN BREACH",
                        "color": "#d62728"
                      }
                    ],
                    [
                      {
                        "expression": "IF(m2==0,0)",
                        "id": "e4",
                        "label": "NO BREACH DETECTED",
                        "color": "#2ca02c"
                      }
                    ]
                  ],
                  "view": "singleValue",
