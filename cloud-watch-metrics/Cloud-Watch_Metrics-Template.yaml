AWSTemplateFormatVersion: '2010-09-09'
Description: Alarms and dashboard for the Manifest Metadata Lambda's CloudWatch
  metrics. These metrics are published directly by the Lambda via
  cloudwatch.put_metric_data() (see put_metric() in manifest_metadata_lambda.py)
  -- this template does not create any metrics itself, it only watches (Alarms)
  and displays (Dashboard) the ones the Lambda is already publishing. Same
  pattern as the partner's business-monitoring template.

Parameters:
  Env:
    Type: String
    AllowedValues:
      - dev
      - stg
      - prod

Resources:

  # ---------------------------------------------------------------------
  # ALARMS -- these watch metrics that already exist in CloudWatch. They
  # do not care whether the metric was published by a direct API call or
  # a log-filter; they just read the namespace + metric name.
  # ---------------------------------------------------------------------

  DatabaseConnectionFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-DatabaseConnectionFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails to connect to the database.
      Namespace: HIE/OperationalMonitoring
      MetricName: DatabaseConnectionFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  MetadataLambdaFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-LambdaFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails while processing a record.
      Namespace: HIE/OperationalMonitoring
      MetricName: MetadataLambdaFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ServiceAvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-ServiceAvailability
      AlarmDescription: Fires when the Lambda reports itself unavailable (retry
        handler also failed), or when it has not reported availability at all.
      Namespace: HIE/OperationalMonitoring
      MetricName: ServiceAvailability
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  CountMismatchEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-CountMismatchEvents
      AlarmDescription: Fires when a batch's actual file/row count does not match its manifest.
      Namespace: HIE/OperationalMonitoring
      MetricName: CountMismatchEvents
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RetryHandlerInvocationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-RetryHandlerFailures
      AlarmDescription: Fires when the retry_utils handler itself fails to run -- no
        retry is guaranteed for the underlying error.
      Namespace: HIE/OperationalMonitoring
      MetricName: RetryHandlerInvocationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------
  # DASHBOARD -- displays the metrics above plus the rest of what the
  # Lambda publishes, grouped the same way the code groups them
  # (HIE/OperationalMonitoring vs HIE/PartnerMonitoring).
  # ---------------------------------------------------------------------

  ManifestMetadataDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub project-hie-analytics-operational-dashboard-${Env}
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# Project HIE Analytics Operational Monitoring - &{Env}"
              }
            },
            {
              "type": "text",
              "x": 0,
              "y": 2,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "## Operational Monitoring Status"  
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Transfer family",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"FilesIn\"', 'Sum', 300)", "id": "e1", "label": "FilesIn" } ],
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"BytesIn\"', 'Sum', 300)", "id": "e2", "label": "BytesIn" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "Storage & Processing",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,FailureCategory} MetricName=\"ActiveIncidents\"', 'Sum', 300)", "id": "e1", "label": "ActiveIncidents" } ],
                  ["HIE/OperationalMonitoring", "S3ObjectArrivals", { "label": "S3ObjectArrivals" } ],
                  ["HIE/OperationalMonitoring", "ProcessingDelaySeconds", { "label": "ProcessingDelays" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16, "y": 0, "width": 8, "height": 6,
              "properties": {
                "title": "DatabaseConnectionFailures",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["HIE/OperationalMonitoring", "DatabaseConnectionFailures"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 6, "width": 8, "height": 8,
              "properties": {
                "title": "Authentication",
                "region": "${AWS::Region}",
                "view": "gauge",
                "period": 300,
                "stat": "Sum",
                "yAxis": { "left": { "min": 0, "max": 5 } },
                "metrics": [
                  ["HIE/OperationalMonitoring", "DatabaseConnectionFailures"]
                ],
                "annotations": {
                  "horizontal": [
                    {
                      "label": "database connection failure",
                      "value": 1,
                      "fill": "above",
                      "color": "#d13212"
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 14, "width": 24, "height": 8,
              "properties": {
                "title": "Partner connectivity",
                "region": "${AWS::Region}",
                "view": "gauge",
                "period": 300,
                "stat": "Sum",
                "yAxis": { "left": { "min": 0, "max": 20 } },
                "metrics": [
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerId} MetricName=\"StaleConnection\"', 'Sum', 300)", "id": "e1", "label": "StaleConnection" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 22, "width": 8, "height": 6,
              "properties": {
                "title": "SNSNotificationsSent",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["HIE/OperationalMonitoring", "SNSNotificationsSent"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8, "y": 22, "width": 16, "height": 6,
              "properties": {
                "title": "ActiveIncidents",
                "region": "${AWS::Region}",
                "view": "gauge",
                "period": 300,
                "stat": "Sum",
                "yAxis": { "left": { "min": 0, "max": 20 } },
                "metrics": [
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,FailureCategory} MetricName=\"ActiveIncidents\"', 'Sum', 300)", "id": "e1", "label": "ActiveIncidents" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 28, "width": 24, "height": 8,
              "properties": {
                "title": "BreachEvents, PartnerInBreach",
                "region": "${AWS::Region}",
                "view": "gauge",
                "period": 300,
                "stat": "Sum",
                "yAxis": { "left": { "min": 0, "max": 20 } },
                "metrics": [
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"BreachEvents\"', 'Sum', 300)", "id": "e1", "label": "BreachEvents" } ],
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"PartnerInBreach\"', 'Sum', 300)", "id": "e2", "label": "PartnerInBreach" } ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 36, "width": 6, "height": 6,
              "properties": {
                "title": "FilesIn",
                "region": "${AWS::Region}",
                "view": "gauge",
                "period": 300,
                "stat": "Sum",
                "yAxis": { "left": { "min": 0, "max": 288 } },
                "metrics": [
                  [ { "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"FilesIn\"', 'Sum', 300)", "id": "e1", "label": "FilesIn" } ]
                ],
                "annotations": {
                  "horizontal": [
                    {
                      "label": "below files",
                      "value": 287,
                      "fill": "below",
                      "color": "#d13212"
                    },
                    {
                      "label": "above files",
                      "value": 288,
                      "fill": "above",
                      "color": "#2ca02c"
                    }
                  ]
                }
              }
            },
            {
              "type": "metric",
              "x": 6, "y": 36, "width": 6, "height": 6,
              "properties": {
                "title": "RetryHandlerInvocationFailures",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["HIE/OperationalMonitoring", "RetryHandlerInvocationFailures"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 36, "width": 6, "height": 6,
              "properties": {
                "title": "DatabaseConnectionRetries",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["HIE/OperationalMonitoring", "DatabaseConnectionRetries"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 18, "y": 36, "width": 6, "height": 6,
              "properties": {
                "title": "ProcessingDelaySeconds",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "period": 300,
                "stat": "Average",
                "metrics": [
                  ["HIE/OperationalMonitoring", "ProcessingDelaySeconds"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 42, "width": 6, "height": 6,
              "properties": {
                "title": "CRUDFailures",
                "region": "${AWS::Region}",
                "view": "singleValue",
                "period": 300,
                "stat": "Sum",
                "metrics": [
                  ["HIE/OperationalMonitoring", "CRUDFailures"]
                ]
              }
            }
          ]
        }
