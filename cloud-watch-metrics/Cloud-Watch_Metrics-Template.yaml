                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${DatabaseProcessorFunctionName}",
                      "FailureType",
                      "DatabaseConnectionFailure",
                      {
                        "label": "Database connection",
                        "color": "#d13212"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 39,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Retries by failure type - CCDA Extraction Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${CCDAExtractionFunctionName}",
                      "FailureType",
                      "DatabaseConnectionFailure",
                      {
                        "label": "Database connection",
                        "color": "#d13212"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
