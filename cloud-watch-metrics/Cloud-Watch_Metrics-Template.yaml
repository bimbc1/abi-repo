                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${ManifestMetadataFunctionName}",
                      "FailureType",
                      "DatabaseConnectionFailure",
                      {
