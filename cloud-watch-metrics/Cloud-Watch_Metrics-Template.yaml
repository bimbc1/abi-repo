                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 39,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Retries by failure type - Monitoring Lambda",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 10
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "RetryEvents",
                      "FunctionName",
                      "${PayloadMonitoringFunctionName}",
                      "FailureType",
                      "DatabaseConnectionFailure",
                      {
                        "label": "Database connection",
                        "color": "#d13212"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "color": "#2ca02c",
                        "label": "OK",
                        "value": 0,
                        "fill": "above"
                      },
                      {
                        "color": "#ff7f0e",
                        "label": "Warning",
                        "value": 1,
                        "fill": "above"
                      },
                      {
                        "color": "#d13212",
                        "label": "Critical",
                        "value": 3,
                        "fill": "above"
                      }
                    ]
                  }
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 39,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Database Processor DLQ Messages",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Maximum",
                  "metrics": [
                    [
                      "AWS/SQS",
                      "Queue depth",
                      "QueueName",
                      "${DlqName}"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 45,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Lambda Health"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 46,
                "width": 24,
                "height": 3,
                "properties": {
                  "markdown": "Open the CloudWatch metrics (invocations, errors, throttles, concurrent executions, duration) for each Lambda function:\n\n${LambdaHealthButtons}"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 49,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Storage & Processing"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 50,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Storage & Processing",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "S3ObjectArrivals",
                      {
                        "label": "S3ObjectArrivals"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 50,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Processing Delays",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds",
                      {
                        "label": "Average delay",
                        "stat": "Average"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds",
                      {
                        "label": "Maximum delay",
                        "stat": "Maximum"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 50,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "ProcessingDelaySeconds",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 56,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Partner Connectivity (select a partner, or All, from the Partner dropdown at the top)"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 63,
                "width": 24,
                "height": 6,
                "properties": {
                  "title": "Partner Connectivity - Breach Status",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"BreachEvents\" PartnerName=\"__PARTNER__\"', 'Sum')",
                        "id": "s2",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SUM(s2)",
                        "id": "m2",
                        "label": "Breach events",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "IF(m2>0,m2)",
                        "id": "e3",
                        "label": "IN BREACH",
                        "color": "#d62728"
                      }
                    ]
                  ],
                  "view": "singleValue",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 69,
                "width": 24,
                "height": 6,
                "properties": {
                  "title": "Partners Not In Breach",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerId,PartnerName} MetricName=\"PartnerNotInBreach\" PartnerName=\"__PARTNER__\"', 'Maximum')",
                        "id": "s3",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SUM(s3)",
                        "id": "m3",
                        "label": "Partners not in breach",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "IF(m3>0,m3)",
                        "id": "e5",
                        "label": "NOT IN BREACH",
                        "color": "#2ca02c"
                      }
                    ]
                  ],
                  "view": "singleValue",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true
                }
              }
            ]
          }
        - ManifestMetadataFunctionName: !Select
            - 6
            - !Split
              - ':'
              - !ImportValue
                Fn::Sub: project-hie-analytics-process-payload-manifest-lambda-arn-${Env}
          TablesGeneratorFunctionName: !Select
            - 6
            - !Split
              - ':'
              - !ImportValue
                Fn::Sub: project-hie-analytics-process-table-generator-lambda-arn-${Env}
          DatabaseProcessorFunctionName: !Select
            - 6
            - !Split
              - ':'
              - !ImportValue
                Fn::Sub: project-hie-analytics-database-processor-lambda-arn-${Env}
          CCDAExtractionFunctionName: !Select
            - 6
            - !Split
              - ':'
              - !ImportValue
                Fn::Sub: project-hie-analytics-ccda-extraction-arn-${Env}
          PayloadMonitoringFunctionName: !Select
            - 6
            - !Split
              - ':'
              - !ImportValue
                Fn::Sub: project-hie-analytics-payload-monitoring-lambda-arn-${Env}

          DlqName: !ImportValue
            Fn::Sub: project-hie-analytics-database-processor-dlq-name-${Env}
          # DATABASE HEALTH BUTTONS -- one list item per database. 
          DatabaseHealthButtons: !Join
            - ' '
            - - !Sub
                - '[button:primary:${Label}
                  (${Db})](https://${Host}/cloudwatch/home?region=${AWS::Region}#metricsV2:graph=~%28view~''timeSeries~stacked~false~region~''${AWS::Region}~stat~''Average~period~300~title~''${Db}~metrics~%28~%28~''AWS*2fRDS~''CPUUtilization~''DBInstanceIdentifier~''${Db}%29~%28~''.~''FreeableMemory~''.~''.~%28yAxis~''right%29%29~%28~''.~''FreeStorageSpace~''.~''.~%28yAxis~''right%29%29%29%29)'
