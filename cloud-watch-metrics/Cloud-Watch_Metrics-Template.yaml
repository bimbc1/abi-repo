                  Db: !Sub project-hie-analytics-admin-registry-db-${Env}
                  Host: !If
                    - IsGovCloud
                    - console.amazonaws-us-gov.com
                    - console.aws.amazon.com
          # LAMBDA HEALTH BUTTONS -- one list item per Lambda function.
