                      "showUnits": false
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${ManifestMetadataFunctionName}",
                      "FailureType",
                      "Read",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Manifest Metadata Lambda",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${DatabaseProcessorFunctionName}",
                      "FailureType",
                      "Read",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Database Processor Lambda",
                        "color": "#2ca02c"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${PayloadMonitoringFunctionName}",
                      "FailureType",
                      "Read",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Payload Monitoring Lambda",
                        "color": "#9467bd"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${CCDAExtractionFunctionName}",
                      "FailureType",
                      "Read",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "CCDA Extraction Lambda",
                        "color": "#8c564b"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 32,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "CRUD failures - Update",
                  "region": "${AWS::Region}",
                  "view": "bar",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "showUnits": false
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${ManifestMetadataFunctionName}",
                      "FailureType",
                      "Update",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Manifest Metadata Lambda",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${DatabaseProcessorFunctionName}",
                      "FailureType",
                      "Update",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Database Processor Lambda",
                        "color": "#2ca02c"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
