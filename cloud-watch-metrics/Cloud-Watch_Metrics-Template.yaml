AWSTemplateFormatVersion: '2010-09-09'
Description: HIE Analytics Operational Monitoring CloudWatch Dashboard and Alarms

Parameters:
  Env:
    Type: String
    AllowedValues:
      - dev
      - stg
      - prod

Resources:

  # ---------------------------------------------------------------------
  # ALARMS -- these watch metrics that already exist in CloudWatch. They
  # do not care whether the metric was published by a direct API call or
  # a log-filter; they just read the namespace + metric name.
  # ---------------------------------------------------------------------

  DatabaseConnectionFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-DatabaseConnectionFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails to connect to the database.
      Namespace: HIE/OperationalMonitoring
      MetricName: DatabaseConnectionFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  MetadataLambdaFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-LambdaFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails while processing a record.
      Namespace: HIE/OperationalMonitoring
      MetricName: MetadataLambdaFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ServiceAvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-ServiceAvailability
      AlarmDescription: Fires when the Lambda reports itself unavailable (retry
        handler also failed), or when it has not reported availability at all.
      Namespace: HIE/OperationalMonitoring
      MetricName: ServiceAvailability
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching

  CountMismatchEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-CountMismatchEvents
      AlarmDescription: Fires when a batch's actual file/row count does not match its manifest.
      Namespace: HIE/OperationalMonitoring
      MetricName: CountMismatchEvents
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RetryHandlerInvocationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-RetryHandlerFailures
      AlarmDescription: Fires when the retry_utils handler itself fails to run -- no
        retry is guaranteed for the underlying error.
      Namespace: HIE/OperationalMonitoring
      MetricName: RetryHandlerInvocationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ---------------------------------------------------------------------
  # DASHBOARD -- displays the metrics above plus the rest of what the
  # Lambda publishes, grouped the same way the code groups them
  # (HIE/OperationalMonitoring vs HIE/PartnerMonitoring).
  # ---------------------------------------------------------------------

  ManifestMetadataDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub project-hie-analytics-operational-dashboard-${Env}
      # Function name is derived from the Lambda ARN exported by the Lambda
      # stack (arn:<partition>:lambda:<region>:<account>:function:<NAME>),
      # so it is never hardcoded here.
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "# Project HIE Analytics Operational Monitoring - ${Env}"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 1,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Operational Monitoring Status"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 2,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## AWS Transfer Family"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 3,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Transfer family",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"FilesIn\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "FilesIn"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 3,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "FilesIn",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "period": 300,
                  "stat": "Sum",
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 288
                    }
                  },
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"FilesIn\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "FilesIn"
                      }
                    ]
                  ],
                  "annotations": {
                    "horizontal": [
                      {
                        "label": "below files",
                        "value": 287,
                        "fill": "below",
                        "color": "#d13212"
                      },
                      {
                        "label": "above files",
                        "value": 288,
                        "fill": "above",
                        "color": "#2ca02c"
                      }
                    ]
                  }
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 9,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Authentication"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 10,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Authentication",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "DatabaseConnectionFailures"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 16,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Workflow Health"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 17,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "RetryHandlerInvocationFailures",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "RetryHandlerInvocationFailures"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 6,
                "y": 17,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "DatabaseConnectionRetries",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "DatabaseConnectionRetries"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 12,
                "y": 17,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Database Processor DLQ Messages",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Maximum",
                  "metrics": [
                    [
                      "AWS/SQS",
                      "ApproximateNumberOfMessagesVisible",
                      "QueueName",
                      "project-hie-analytics-database-processor-dlq-${Env}"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 23,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Lambda Health"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 24,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Lambda Invocations",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Invocations",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      {
                        "label": "Invocations"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 24,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Lambda Errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      {
                        "label": "Errors",
                        "color": "#d13212"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 24,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Lambda Throttles",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Throttles",
                      "FunctionName",
                      "${LambdaFunctionName}",
                      {
                        "label": "Throttles",
                        "color": "#ff7f0e"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 30,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "CCDA Extraction Lambda Invocations",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Invocations",
                      "FunctionName",
                      "${CcdaExtractionFunctionName}",
                      {
                        "label": "Invocations"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 30,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "CCDA Extraction Lambda Errors",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Errors",
                      "FunctionName",
                      "${CcdaExtractionFunctionName}",
                      {
                        "label": "Errors",
                        "color": "#d13212"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 30,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "CCDA Extraction Lambda Throttles",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "AWS/Lambda",
                      "Throttles",
                      "FunctionName",
                      "${CcdaExtractionFunctionName}",
                      {
                        "label": "Throttles",
                        "color": "#ff7f0e"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 36,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Storage & Processing"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 37,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Storage & Processing",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,FailureCategory} MetricName=\"ActiveIncidents\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "ActiveIncidents"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "S3ObjectArrivals",
                      {
                        "label": "S3ObjectArrivals"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 37,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Processing Delays",
                  "region": "${AWS::Region}",
                  "view": "timeSeries",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,FailureCategory} MetricName=\"ActiveIncidents\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "ActiveIncidents"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds",
                      {
                        "label": "ProcessingDelays"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 16,
                "y": 37,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "ProcessingDelaySeconds",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Average",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "ProcessingDelaySeconds"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 43,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Database Health"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 44,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "CRUDFailures",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailures"
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 50,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Partner Connectivity"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 51,
                "width": 24,
                "height": 8,
                "properties": {
                  "title": "Partner connectivity",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "period": 300,
                  "stat": "Sum",
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 20
                    }
                  },
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerId} MetricName=\"StaleConnection\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "StaleConnection"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 59,
                "width": 24,
                "height": 8,
                "properties": {
                  "title": "BreachEvents, PartnerInBreach",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "period": 300,
                  "stat": "Sum",
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 20
                    }
                  },
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"BreachEvents\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "BreachEvents"
                      }
                    ],
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,PartnerName} MetricName=\"PartnerInBreach\"', 'Sum', 300)",
                        "id": "e2",
                        "label": "PartnerInBreach"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 67,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Alerting"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 68,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "SNSNotificationsSent",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "period": 300,
                  "stat": "Sum",
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "SNSNotificationsSent"
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 68,
                "width": 16,
                "height": 6,
                "properties": {
                  "title": "ActiveIncidents",
                  "region": "${AWS::Region}",
                  "view": "gauge",
                  "period": 300,
                  "stat": "Sum",
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "max": 20
                    }
                  },
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/PartnerMonitoring,FailureCategory} MetricName=\"ActiveIncidents\"', 'Sum', 300)",
                        "id": "e1",
                        "label": "ActiveIncidents"
                      }
                    ]
                  ]
                }
              }
            ]
          }
        - LambdaFunctionName: !Select
            - 6
            - !Split
              - ":"
              - Fn::ImportValue: !Sub process-payload-manifest-lambda-arn-${Env}
          CcdaExtractionFunctionName: !Select
            - 6
            - !Split
              - ":"
              - Fn::ImportValue: !Sub project-hie-analytics-ccda-extraction-arn-${Env}
