AWSTemplateFormatVersion: '2010-09-09'
Description: HIE Analytics Operational Monitoring CloudWatch Dashboard and Alarms

Parameters:
  Env:
    Type: String
    AllowedValues:
      - dev
      - stg
      - prod
  TransferLogGroupName:
    Type: String
    Default: /aws/transfer/s-4603e09e711e4cfa8
    Description: CloudWatch log group of the AWS Transfer Family (SFTP) server
  FileProcessingFailurePattern:
    Type: String
    Default: '?BadZipFile ?"Bad CRC-32" ?"Error -3 while decompressing"'
    Description: CloudWatch Logs filter pattern that matches the Extractor lambda

Conditions:
  IsGovCloud: !Equals
    - !Ref AWS::Partition
    - aws-us-gov


Resources:

  # ALARMS -- these watch metrics that already exist in CloudWatch.

  DatabaseConnectionFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-DatabaseConnectionFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails to connect to the database.
      Namespace: HIE/OperationalMonitoring
      MetricName: DatabaseConnectionFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  MetadataLambdaFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-LambdaFailures
      AlarmDescription: Fires when the Manifest Metadata Lambda fails while processing a record.
      Namespace: HIE/OperationalMonitoring
      MetricName: MetadataLambdaFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  ServiceAvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-ServiceAvailability
      AlarmDescription: Fires when the Lambda reports itself unavailable (retry
        handler also failed), or when it has not reported availability at all.
      Namespace: HIE/OperationalMonitoring
      MetricName: ServiceAvailability
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching

  CountMismatchEventsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-CountMismatchEvents
      AlarmDescription: Fires when a batch's actual file/row count does not match its manifest.
      Namespace: HIE/OperationalMonitoring
      MetricName: CountMismatchEvents
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  RetryHandlerInvocationFailuresAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: ManifestMetadata-RetryHandlerFailures
      AlarmDescription: Fires when the retry_utils handler itself fails to run -- no
        retry is guaranteed for the underlying error.
      Namespace: HIE/OperationalMonitoring
      MetricName: RetryHandlerInvocationFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # LOG METRIC FILTERS -- 

  PartnerLoginFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TransferLogGroupName
      FilterPattern: '"AUTH_FAILURE"'
      MetricTransformations:
        - MetricNamespace: HIE/OperationalMonitoring
          MetricName: PartnerLoginFailures
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # This Transfer Family server writes plain-text log lines, e.g.
  #   ERRORS AUTH_FAILURE Method=publickey User=Epic Message="..." SourceIP=...
  #   Oracle.4f2ac91b2e9a6d35 CLOSE Path=/bucket/file.txt BytesIn=1553
  # The transformer splits each line into stream, activity and the Key=Value
  # pairs (User, BytesIn, ...). "tfuser" is the username taken from the
  # stream (Oracle.<session-id> -> Oracle), used for uploads that have no User=.
  TransferLogTransformer:
    Type: AWS::Logs::Transformer
    Properties:
      LogGroupIdentifier: !Ref TransferLogGroupName
      TransformerConfig:
        - Grok:
            Match: '%{NOTSPACE:stream} %{NOTSPACE:activity} %{GREEDYDATA:details}'
        - ParseKeyValue:
            Source: details
            FieldDelimiter: ' '
            KeyValueDelimiter: '='
            NonMatchValue: 'none'
        - CopyValue:
            Entries:
              - Source: stream
                Target: tfuser
        - SubstituteString:
            Entries:
              - Source: tfuser
                From: '^(.+)\.[0-9A-Za-z]+$'
                To: '$1'

  # Per-user activity; fills the "Transfer Family user" dropdown (with the
  # "All" entry the Manifest Lambda publishes under PartnerName).
  TransferFamilyUsersMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: TransferLogTransformer
    Properties:
      LogGroupName: !Ref TransferLogGroupName
      ApplyOnTransformedLogs: true
      FilterPattern: '{ ($.activity = "CONNECTED") && ($.tfuser = "*") }'
      MetricTransformations:
        - MetricNamespace: HIE/OperationalMonitoring
          MetricName: TransferFamilyConnectedUsers
          MetricValue: '1'
          Unit: Count
          Dimensions:
            - Key: PartnerName
              Value: $.tfuser

  # Login failures per user (dimension "All" so "All" matches every user).
  LoginFailuresByUserMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: TransferLogTransformer
    Properties:
      LogGroupName: !Ref TransferLogGroupName
      ApplyOnTransformedLogs: true
      FilterPattern: '{ $.activity = "AUTH_FAILURE" }'
      MetricTransformations:
        - MetricNamespace: HIE/OperationalMonitoring
          MetricName: LoginFailuresByUser
          MetricValue: '1'
          Unit: Count
          Dimensions:
            - Key: All
              Value: $.User

  # Counts each file uploaded through Transfer Family per user (CLOSE line
  # with BytesIn=). Dimension "All" so the dropdown value "All" matches everyone.
  TransferFamilyFilesInMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: TransferLogTransformer
    Properties:
      LogGroupName: !Ref TransferLogGroupName
      ApplyOnTransformedLogs: true
      FilterPattern: '{ ($.activity = "CLOSE") && ($.BytesIn = "*") }'
      MetricTransformations:
        - MetricNamespace: HIE/OperationalMonitoring
          MetricName: TransferFamilyFilesIn
          MetricValue: '1'
          Unit: Count
          Dimensions:
            - Key: All
              Value: $.tfuser

  UploadFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref TransferLogGroupName
      FilterPattern: '"PARTIAL_CLOSE"'
      MetricTransformations:
        - MetricNamespace: HIE/OperationalMonitoring
          MetricName: UploadFailures
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  FileProcessingFailuresMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Join
        - ''
        - - /aws/lambda/
          - !Select
            - 6
            - !Split
              - ':'
              - !ImportValue
                Fn::Sub: project-hie-analytics-ccda-extraction-arn-${Env}
      FilterPattern: !Ref FileProcessingFailurePattern
      MetricTransformations:
        - MetricNamespace: HIE/OperationalMonitoring
          MetricName: FileProcessingFailures
          MetricValue: '1'
          DefaultValue: 0
          Unit: Count

  # DASHBOARD -- displays the metrics 

  ManifestMetadataDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub project-hie-analytics-operational-dashboard-${Env}
      DashboardBody: !Sub
        - |
          {
            "variables": [
              {
                "type": "pattern",
                "pattern": "__PARTNER__",
                "inputType": "select",
                "id": "partner",
                "label": "Partner",
                "visible": true,
                "search": "{HIE/PartnerMonitoring,PartnerId,PartnerName} MetricName=\"PartnerNotInBreach\"",
                "populateFrom": "PartnerName",
                "defaultValue": "All"
              },
              {
                "type": "pattern",
                "pattern": "__SFTPUSER__",
                "inputType": "select",
                "id": "sftpuser",
                "label": "Transfer Family user",
                "visible": true,
                "search": "MetricName=\"TransferFamilyConnectedUsers\" OR (MetricName=\"PartnerNotInBreach\" PartnerName=\"All\")",
                "populateFrom": "PartnerName",
                "defaultValue": "All"
              }
            ],
            "widgets": [
              {
                "type": "text",
                "x": 0,
                "y": 0,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "# Project HIE Analytics Operational Monitoring - ${Env}"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 1,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Operational Monitoring Status"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 2,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## AWS Transfer Family (select a partner, or All, from the Partner dropdown at the top)"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 3,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Transfer family user:Files in",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "stat": "Sum",
                  "period": 1800,
                  "liveData": true,
                  "sparkline": false,
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/OperationalMonitoring,All} MetricName=\"TransferFamilyFilesIn\" \"__SFTPUSER__\"', 'Sum', 1800)",
                        "id": "tu",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "FILL(SUM(tu), 0)",
                        "id": "tfiles",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SEARCH('{HIE/OperationalMonitoring,PartnerName} MetricName=\"TransferFamilyConnectedUsers\"', 'Sum', 1800)",
                        "id": "tua",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SEARCH('{HIE/OperationalMonitoring,PartnerName} MetricName=\"TransferFamilyConnectedUsers\" PartnerName=\"__SFTPUSER__\"', 'Sum', 1800)",
                        "id": "tsel",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SUM([tfiles * 0, FILL(tua, 0) * 0 + 1])",
                        "id": "tusers",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "MAX([tfiles * 0, FILL(tsel, 0) * 0 + 1])",
                        "id": "tone",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "IF(EPOCH(tfiles) < MAX(EPOCH(tfiles)), 6 * PERIOD(tfiles) / 1800 * (MAX(tone) + (1 - MAX(tone)) * MAX(MAX([tusers, tfiles * 0 + 1]))))",
                        "id": "texpected",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "tfiles * 0 + MAX(RUNNING_SUM(tfiles))",
                        "id": "totrecv",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "tfiles * 0 + MAX(RUNNING_SUM(texpected))",
                        "id": "totexp",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "totexp + 0",
                        "id": "pt",
                        "label": "Expected",
                        "color": "#7f7f7f"
                      }
                    ],
                    [
                      {
                        "expression": "totrecv + 0",
                        "id": "pr",
                        "label": "Received",
                        "color": "#2ca02c"
                      }
                    ],
                    [
                      {
                        "expression": "MAX([totexp - totrecv, tfiles * 0])",
                        "id": "ps",
                        "label": "Shortfall",
                        "color": "#d13212"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 9,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Upload failures",
                  "region": "${AWS::Region}",
                  "view": "singleValue",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "UploadFailures",
                      {
                        "label": "Upload failures",
                        "color": "#d13212"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 15,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Authentication (select a user, or All, from the Transfer Family user dropdown at the top)"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 16,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Partner login failures",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/OperationalMonitoring,All} MetricName=\"LoginFailuresByUser\" \"__SFTPUSER__\"', 'Sum')",
                        "id": "u1",
                        "visible": false
                      }
                    ],
                    [
                      {
                        "expression": "SUM(u1)",
                        "id": "u2",
                        "label": "Login failures",
                        "color": "#d13212"
                      }
                    ]
                  ],
                  "view": "singleValue",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true
                }
              },
              {
                "type": "metric",
                "x": 8,
                "y": 16,
                "width": 16,
                "height": 6,
                "properties": {
                  "title": "Partner login failures - by partner",
                  "region": "${AWS::Region}",
                  "metrics": [
                    [
                      {
                        "expression": "SEARCH('{HIE/OperationalMonitoring,All} MetricName=\"LoginFailuresByUser\" \"__SFTPUSER__\"', 'Sum')",
                        "id": "b1",
                        "label": "${!PROP('Dim.All')}"
                      }
                    ]
                  ],
                  "view": "table",
                  "table": {
                    "layout": "horizontal",
                    "showTimeSeriesData": false,
                    "summaryColumns": [
                      "SUM"
                    ]
                  },
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 29,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Database Health (select a partner, or All, from the Partner dropdown at the top)"
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 30,
                "width": 24,
                "height": 2,
                "properties": {
                  "markdown": "Open the CloudWatch metrics (CPU utilization, freeable memory, free storage space) for the database:\n\n${DatabaseHealthButtons}"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 32,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "CRUD failures - Create",
                  "region": "${AWS::Region}",
                  "view": "bar",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
                      "min": 0,
                      "showUnits": false
                    }
                  },
                  "metrics": [
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${ManifestMetadataFunctionName}",
                      "FailureType",
                      "Create",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Manifest Metadata Lambda",
                        "color": "#1f77b4"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${DatabaseProcessorFunctionName}",
                      "FailureType",
                      "Create",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Database Processor Lambda",
                        "color": "#2ca02c"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${PayloadMonitoringFunctionName}",
                      "FailureType",
                      "Create",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Payload Monitoring Lambda",
                        "color": "#9467bd"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${CCDAExtractionFunctionName}",
                      "FailureType",
                      "Create",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "CCDA Extraction Lambda",
                        "color": "#8c564b"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "metric",
                "x": 6,
                "y": 32,
                "width": 6,
                "height": 6,
                "properties": {
                  "title": "CRUD failures - Read",
                  "region": "${AWS::Region}",
                  "view": "bar",
                  "stat": "Sum",
                  "period": 300,
                  "setPeriodToTimeRange": true,
                  "yAxis": {
                    "left": {
