                      "FailureType",
                      "Update",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "Payload Monitoring Lambda",
                        "color": "#9467bd"
                      }
                    ],
                    [
                      "HIE/OperationalMonitoring",
                      "CRUDFailureEvents",
                      "FunctionName",
                      "${CCDAExtractionFunctionName}",
                      "FailureType",
                      "Update",
                      "PartnerName",
                      "__PARTNER__",
                      {
                        "label": "CCDA Extraction Lambda",
                        "color": "#8c564b"
                      }
                    ]
                  ]
                }
              },
              {
                "type": "text",
                "x": 0,
                "y": 38,
                "width": 24,
                "height": 1,
                "properties": {
                  "markdown": "## Workflow Health"
                }
              },
              {
                "type": "metric",
                "x": 0,
                "y": 39,
                "width": 8,
                "height": 6,
                "properties": {
                  "title": "Retries by failure type - Manifest Metadata Lambda",
