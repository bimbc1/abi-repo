---
AWSTemplateFormatVersion: "2010-09-09"
Description: Template for SNS Ingestion failure topic creation and subscription.

Parameters:
  Env:
    Type: String
    AllowedValues: 
      - dev
      - stg
      - prod

Mappings:
  EnvConfig:
    dev:
      EmailAddress1: abimbolaabiodun6@gmail.com
    stg:
      EmailAddress1: abimbolaabiodun6@gmail.com
    prod:
      EmailAddress1: abimbolaabiodun6@gmail.com

Resources:
  IngestionFailureSNSKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub KMS key for the ingestion failure alerts SNS topic ${Env}
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
          - Sid: AllowAccountPublishersThroughSNS
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey*
            Resource: "*"
            Condition:
              StringEquals:
                kms:CallerAccount: !Ref AWS::AccountId
                kms:ViaService: !Sub sns.${AWS::Region}.amazonaws.com

  IngestionFailureSNSTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub project-hie-analytics-ingestion-failure-alerts-${Env}
      DisplayName: !Sub Ingestion Failure Alerts ${Env}
      KmsMasterKeyId: !Ref IngestionFailureSNSKey
    
  IngestionFailureEmailSubscription1:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref IngestionFailureSNSTopic
      Protocol: email
      Endpoint: !FindInMap [EnvConfig, !Ref Env, EmailAddress1]
  
Outputs:
  IngestionFailureSNSTopicArn:
    Description: "ARN of the SNS topic for ingestion failure alerts"
    Value: !Ref IngestionFailureSNSTopic
    Export: 
      Name: !Sub project-hie-analytics-ingestion-failure-alerts-sns-topic-arn-${Env}
    
  IngestionFailureSNSTopicName:
    Description: "Name of the SNS topic for ingestion failure alerts"
    Value: !GetAtt IngestionFailureSNSTopic.TopicName
    Export: 
      Name: !Sub project-hie-analytics-ingestion-failure-alerts-sns-topic-name-${Env}
