AWSTemplateFormatVersion: '2010-09-09'
Description: S3 Bucket with S3 ? Lambda trigger

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, stg, prod]

Resources:

  # Lambda Permission: Allow S3 to invoke Lambda
  AllowOracleHealthBucketInvokeProcessManifestLambda:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !ImportValue 
        Fn::Sub: project-hie-analytics-process-payload-manifest-lambda-arn-${Env}
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws-us-gov:s3:::project-hie-analytics-OracleHealth-Historical-Documents-Uploads-Bucket-Arn-${Env}
 

  # Oracle Document Uploads Bucket
  OracleHealthHistoricalDocumentsBucket:
    Type: AWS::S3::Bucket
    DependsOn:
      - AllowOracleHealthBucketInvokeProcessManifestLambda
    Properties:
      BucketName: !Sub project-hie-analytics-oraclehealth-historical-documents-${Env}
      LifecycleConfiguration:
        Rules:
          - Id: DeleteAfter14Days
            Status: Enabled
            ExpirationInDays: 14
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !ImportValue 
              Fn::Sub: project-hie-analytics-process-payload-manifest-lambda-arn-${Env}
      Tags:
        - Key: tenant:CKID
          Value: "2598"
        - Key: tenant:VAECID
          Value: "AWG20251201001"
        - Key: va_vasi_id
          Value: "2238"
        - Key: Name
          Value: !Sub project-hie-analytics-oraclehealth-historical-documents-${Env}
        - Key: Purpose
          Value: oraclehealth-historical-documents



Outputs:

  OracleHealthBucketArn:
    Description: ARN for Oracle Document Uploads bucket
    Value: !GetAtt OracleHealthHistoricalDocumentsBucket.Arn
    Export:
      Name: !Sub project-hie-analytics-OracleHealth-Historical-Documents-Uploads-Bucket-Arn-${Env}

  OracleHealthBucketName:
    Description: Name for Oracle Document Uploads bucket
    Value: !Ref OracleHealthHistoricalDocumentsBucket
    Export:
      Name: !Sub project-hie-analytics-OracleHealth-Historical-Documents-Uploads-Bucket-Name-${Env}
