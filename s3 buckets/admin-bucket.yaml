AWSTemplateFormatVersion: '2010-09-09'
Description: S3 bucket for the admin partner registry exports

Parameters:
  Env:
    Type: String
    AllowedValues:
      - dev
      - stg
      - prod

  ProjectName:
    Type: String
    Default: project-hie-analytics
    Description: Prefix used for every resource and export name in this stack

Resources:

  # Admin Registry Bucket
  AdminRegistryBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-admin-registry-bucket-${Env}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: tenant:CKID
          Value: '2598'
        - Key: tenant:VAECID
          Value: AWG20251201001
        - Key: va_vasi_id
          Value: '2238'
        - Key: Name
          Value: !Sub ${ProjectName}-admin-registry-bucket-${Env}
        - Key: Purpose
          Value: admin-registry

  # Enforce TLS on the registry bucket
  AdminRegistryBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AdminRegistryBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AdminRegistryBucket.Arn
              - !Sub '${AdminRegistryBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'

Outputs:

  AdminRegistryBucketArn:
    Description: ARN for Admin Registry bucket
    Value: !GetAtt AdminRegistryBucket.Arn
    Export:
      Name: !Sub ${ProjectName}-admin-registry-bucket-arn-${Env}
