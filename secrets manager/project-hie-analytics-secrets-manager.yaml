---
AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager Stack

Parameters:
  Env:
    Type: String
    AllowedValues:
    - dev
    - stg
    - prod
    
Resources:

  CDQRdsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Tags:
          - Key: tenant:CKID
            Value: "2598"
          - Key: tenant:VAECID
            Value: "AWG20251201001"
          - Key: va_vasi_id
            Value: "2238"
      Name: !Sub project-hie-analytics-rds-credentials-${Env}
      Description: RDS credentials
      GenerateSecretString:
        SecretStringTemplate: |
          {
            "username": "cdquser"
          }
        GenerateStringKey: "password"
        PasswordLength: 32
        ExcludeCharacters: "\"'@/\\ \n\r\t"

Outputs:
  CDQRdsSecretArn:
    Value: !Ref CDQRdsSecret
    Export:
      Name: !Sub project-hie-analytics-rds-secret-arn-${Env}
